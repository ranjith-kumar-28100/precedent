[project]
name = "precedent-band"
version = "0.1.0"
description = "Precedent as a team of Band agents (Scout, Negotiator, Ledger)"
requires-python = ">=3.11"
dependencies = ["band-sdk[langgraph]==8.1.0", "httpx>=0.27", "pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.uv]
package = false
